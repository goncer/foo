<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Los Pachones">
<meta name="theme-color" content="#c8102e">
<title>Los Pachones</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2230; --muted: #6b7280; --line: #e6e8ec;
    --accent: #c8102e; --accent-soft: #fde8eb; --win: #16a34a; --draw: #9ca3af; --loss: #dc2626; --prov: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e26; --text: #e8eaf0; --muted: #9aa1b2; --line: #2a2e39; --accent: #ff4d5e; --accent-soft: #3a1d24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--accent); color: #fff; padding: 18px 16px 64px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 640px; margin: -48px auto 0; padding: 0 16px 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .status { padding: 28px; text-align: center; color: var(--muted); }
  .error { color: var(--loss); }

  /* next match */
  .next { padding: 16px; margin-bottom: 14px; }
  .next .label { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; }
  .next .vs { font-size: 21px; font-weight: 800; margin: 4px 0 8px; }
  .next .where { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }
  .next .when { font-size: 16px; font-weight: 600; }
  .next .when::first-letter { text-transform: uppercase; }
  .next .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .next .countdown { margin-top: 10px; font-size: 13px; color: var(--muted); }

  /* tabs */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .tabs button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 4px; border-radius: 10px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* standings */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.team, th.team { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  tr.us td { background: var(--accent-soft); font-weight: 700; }
  .pts { font-weight: 700; }
  @media (max-width: 420px) { .wide { display: none; } }

  /* lists */
  .item { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .round { font-size: 12px; color: var(--muted); font-weight: 600; }
  .opp { font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); }
  .score { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; font-weight: 800; color: #fff; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; }
  .W { background: var(--win); } .D { background: var(--draw); } .L { background: var(--loss); }
  .tag { font-size: 11px; font-weight: 600; color: var(--prov); }
  .time { text-align: right; font-size: 13px; }
  .pending { color: var(--muted); font-size: 12px; }

  footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
  footer button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px; }
</style>
</head>
<body>
<header>
  <h1>LOS PACHONES</h1>
  <p id="league">Liga de Veteranos F-S</p>
</header>
<main>
  <section class="card next" id="next"><div class="status">Cargando…</div></section>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="standings" aria-selected="true">Clasificación</button>
    <button role="tab" data-tab="results" aria-selected="false">Resultados</button>
    <button role="tab" data-tab="upcoming" aria-selected="false">Próximos</button>
  </div>
  <section class="card" id="content"><div class="status">Cargando…</div></section>
  <footer><span id="updated"></span> · <button id="reload">Actualizar</button></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const key = new URLSearchParams(location.search).get('key') || '';
let data = null;
let tab = (() => { try { return localStorage.getItem('pachones.tab') || 'standings'; } catch { return 'standings'; } })();

const toDate = (d, t) => { const [dd, mm, yy] = d.split('-').map(Number); const [h, mi] = (t || '00:00').split(':').map(Number); return new Date(yy, mm - 1, dd, h, mi); };
const longDate = (d) => toDate(d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const shortDate = (d) => toDate(d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
const outcomeEs = { W: 'G', D: 'E', L: 'P' };

async function load() {
  $('updated').textContent = 'Actualizando…';
  try {
    const r = await fetch('/api/nfg' + (key ? '?key=' + encodeURIComponent(key) : ''));
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    data = body.data;
    const title = (t) => t.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()).replace(/\bF-s\b/, 'F-S').replace(/ De /g, ' de ');
    $('league').textContent = [data.group && title(data.group), data.season].filter(Boolean).join(' · ');
    $('updated').textContent = 'Actualizado ' + new Date(body.fetchedAt).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    renderNext();
    render();
  } catch (e) {
    const msg = `<div class="status error">No se pudieron cargar los datos.<br>${esc(e.message)}</div>`;
    $('next').innerHTML = msg; $('content').innerHTML = ''; $('updated').textContent = '';
  }
}

function renderNext() {
  const m = data.upcoming[0];
  if (!m) { $('next').innerHTML = '<div class="label">Próximo partido</div><div class="vs">Temporada terminada</div>'; return; }
  const kick = toDate(m.date, m.time);
  const days = Math.round((new Date(kick.getFullYear(), kick.getMonth(), kick.getDate()) - new Date(new Date().toDateString())) / 864e5);
  const inDays = days <= 0 ? '¡Hoy!' : days === 1 ? 'Mañana' : `En ${days} días`;
  $('next').innerHTML = `
    <div class="label">Próximo partido · Jornada ${m.round}</div>
    <div class="vs">${m.home ? 'vs' : '@'} ${esc(m.opponent)}<span class="where">${m.home ? 'Local' : 'Visitante'}</span></div>
    <div class="when">${esc(longDate(m.date))}${m.time ? ' · ' + esc(m.time) : ''}</div>
    <div class="meta">${m.venue ? esc(m.venue) : 'Horario y campo por confirmar'}</div>
    <div class="countdown">${inDays}</div>`;
}

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (!data) return;
  if (tab === 'standings') renderStandings();
  else if (tab === 'results') renderResults();
  else renderUpcoming();
}

function renderStandings() {
  const rows = data.standings;
  $('content').innerHTML = `<table><thead><tr><th>#</th><th class="team">Equipo</th><th>Pts</th><th>PJ</th>
    <th class="wide">G</th><th class="wide">E</th><th class="wide">P</th><th>Goles</th></tr></thead><tbody>
    ${rows.map((r) => `<tr class="${r.team === data.team ? 'us' : ''}"><td>${r.position}</td><td class="team">${esc(r.team)}</td>
      <td class="pts">${r.points}</td><td>${r.played}</td><td class="wide">${r.won}</td><td class="wide">${r.drawn}</td><td class="wide">${r.lost}</td>
      <td>${r.goalsFor}:${r.goalsAgainst}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderResults() {
  if (!data.results.length) { $('content').innerHTML = '<div class="status">Todavía no hay resultados.</div>'; return; }
  $('content').innerHTML = data.results.map((m) => `
    <div class="item">
      <div class="round">J${m.round}</div>
      <div><div class="opp">${m.home ? 'vs' : '@'} ${esc(m.opponent)}</div>
        <div class="sub">${esc(shortDate(m.date))} · ${m.home ? 'Local' : 'Visitante'}${m.status === 'provisional' ? ' · <span class="tag">provisional</span>' : m.status === 'live' ? ' · <span class="tag">en juego</span>' : ''}</div></div>
      <div class="score">${m.goalsFor}-${m.goalsAgainst}<span class="badge ${m.outcome}">${outcomeEs[m.outcome]}</span></div>
    </div>`).join('');
}

function renderUpcoming() {
  if (!data.upcoming.length) { $('content').innerHTML = '<div class="status">No quedan partidos.</div>'; return; }
  $('content').innerHTML = data.upcoming.map((m) => `
    <div class="item">
      <div class="round">J${m.round}</div>
      <div><div class="opp">${m.home ? 'vs' : '@'} ${esc(m.opponent)}</div>
        <div class="sub">${m.home ? 'Local' : 'Visitante'}${m.venue ? ' · ' + esc(m.venue) : ''}</div></div>
      <div class="time">${esc(shortDate(m.date))}<br>${m.time ? '<b>' + esc(m.time) + '</b>' : '<span class="pending">por confirmar</span>'}</div>
    </div>`).join('');
}

document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  tab = b.dataset.tab; try { localStorage.setItem('pachones.tab', tab); } catch {}
  render();
}));
$('reload').onclick = load;
load();
</script>
</body>
</html>
